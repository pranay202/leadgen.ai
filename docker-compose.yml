services:
  db:
    image: postgres:15-alpine
    container_name: leadgen-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=leadgen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: leadgen-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/leadgen?schema=public
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PORT=3001
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    container_name: leadgen-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
