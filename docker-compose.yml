version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: offline-biz-finder-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=offlinebizfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: offline-biz-finder-api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/offlinebizfinder?schema=public
      - JWT_SECRET=supersecretjwtkey
      - PORT=3001
      - GOOGLE_MAPS_API_KEY=AIzaSyBZO_ADILi_1-cUVYMzIpmHKuZzEM72dYw
    ports:
      - "3001:3001"
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    container_name: offline-biz-finder-web
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
