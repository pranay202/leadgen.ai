[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/local/bin/start-postgres.sh
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err

[program:api]
command=npm start
directory=/app/api
autostart=false
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.err
environment=DATABASE_URL="postgresql://postgres:postgres@localhost:5432/leadgen?schema=public",PORT="3001",JWT_SECRET="%(ENV_JWT_SECRET)s",GOOGLE_MAPS_API_KEY="%(ENV_GOOGLE_MAPS_API_KEY)s"

[program:web]
command=npm start
directory=/app/web
autostart=false
autorestart=true
stdout_logfile=/var/log/web.log
stderr_logfile=/var/log/web.err
environment=HOSTNAME="0.0.0.0",PORT="3000"

[program:nginx]
command=nginx -g "daemon off;"
autostart=false
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.err
