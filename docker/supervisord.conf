[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/usr/local/bin/start-postgres.sh
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/postgres.log
stderr_logfile=/var/log/postgres.err

[program:api]
command=npm start
directory=/app/api
autostart=true
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.err
environment=DATABASE_URL="postgresql://postgres:postgres@localhost:5432/offlinebizfinder?schema=public",PORT=3001,JWT_SECRET="supersecretjwtkey"

[program:web]
command=npm start
directory=/app/web
autostart=true
autorestart=true
stdout_logfile=/var/log/web.log
stderr_logfile=/var/log/web.err
environment=NEXT_PUBLIC_API_URL="http://localhost:3001/api"
