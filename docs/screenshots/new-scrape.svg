<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Leadgen.ai new scrape screen</title>
  <desc id="desc">A screenshot-style illustration of the new scrape form.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/><rect width="1200" height="72" fill="#fff" stroke="#e2e8f0"/>
  <text x="42" y="45" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Leadgen.ai</text><text x="330" y="45" font-family="Arial" font-size="15" fill="#0891b2">⌕  New Scrape</text>
  <text x="42" y="145" font-family="Arial" font-size="30" font-weight="700" fill="#0f172a">Find your next opportunities</text><text x="42" y="178" font-family="Arial" font-size="16" fill="#64748b">Describe the businesses you want to reach.</text>
  <rect x="42" y="220" width="760" height="470" rx="18" fill="#fff" stroke="#e2e8f0"/><text x="78" y="270" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Search details</text><text x="78" y="296" font-family="Arial" font-size="14" fill="#64748b">Set your market and search scope.</text>
  <rect x="78" y="325" width="688" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="100" y="357" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Google Maps</text><text x="100" y="380" font-family="Arial" font-size="12" fill="#64748b">Use Google Places for structured local business results.</text><rect x="702" y="348" width="42" height="24" rx="12" fill="#cbd5e1"/><circle cx="714" cy="360" r="8" fill="#fff"/>
  <text x="78" y="440" font-family="Arial" font-size="13" font-weight="700" fill="#334155">City</text><rect x="78" y="452" width="330" height="48" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="96" y="482" font-family="Arial" font-size="14" fill="#94a3b8">e.g. New York</text>
  <text x="436" y="440" font-family="Arial" font-size="13" font-weight="700" fill="#334155">Business Category</text><rect x="436" y="452" width="330" height="48" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="454" y="482" font-family="Arial" font-size="14" fill="#94a3b8">e.g. Dentists</text>
  <text x="78" y="548" font-family="Arial" font-size="13" font-weight="700" fill="#334155">Lead Limit (up to 1,000 per scrape)</text><rect x="78" y="560" width="688" height="48" rx="9" fill="#fff" stroke="#cbd5e1"/><text x="96" y="590" font-family="Arial" font-size="14" fill="#0f172a">25</text>
  <rect x="78" y="628" width="688" height="44" rx="9" fill="#0e7490"/><text x="354" y="656" font-family="Arial" font-size="14" font-weight="700" fill="#fff">⌕  Start searching</text>
  <rect x="840" y="220" width="318" height="230" rx="18" fill="#ecfeff" stroke="#a5f3fc"/><text x="872" y="270" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Search with intent</text><text x="872" y="306" font-family="Arial" font-size="14" fill="#475569">Specific categories and cities</text><text x="872" y="329" font-family="Arial" font-size="14" fill="#475569">give you cleaner lead lists.</text><text x="872" y="395" font-family="Arial" font-size="13" font-weight="700" fill="#155e75">Example: “Independent dental</text><text x="872" y="416" font-family="Arial" font-size="13" font-weight="700" fill="#155e75">clinics” in “Brooklyn”</text>
</svg>
